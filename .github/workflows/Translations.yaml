name: ' Translations (WIP)'

# WIP: Compile -> locate .g.xlf -> read config.json -> Trados translate.
# The commit-back step is not wired up yet - this run only shows what
# would be written, via the uploaded artifact and the job summary.

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run - skip real TRADOS API calls'
        type: boolean
        default: true
  push:
    # WIP: nur der Testbranch, damit workflow_dispatch nicht erst auf dem
    # Default-Branch registriert sein muss, um dispatchbar zu sein.
    branches: [ 'dev/tsc/translations' ]

defaults:
  run:
    shell: powershell

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read

env:
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  Translate:
    runs-on: [ windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.2
        with:
          shell: powershell
          project: '.'
          buildMode: 'Default'
          get: artifact,generateDependencyArtifact

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v9.2
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'appDependencySecrets'

      - name: Determine ArtifactUrl
        id: determineArtifactUrl
        uses: microsoft/AL-Go-Actions/DetermineArtifactUrl@v9.2
        with:
          shell: powershell
          project: '.'

      - name: Download Project Dependencies
        id: DownloadProjectDependencies
        uses: microsoft/AL-Go-Actions/DownloadProjectDependencies@v9.2
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
        with:
          shell: powershell
          project: '.'
          buildMode: 'Default'
          projectDependenciesJson: '{}'
          baselineWorkflowRunId: '0'

      - name: Compile Apps (containerlos)
        id: compile
        uses: microsoft/AL-Go-Actions/CompileApps@v9.2
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
          BuildMode: 'Default'
        with:
          shell: powershell
          artifact: ${{ env.artifact }}
          project: '.'
          buildMode: 'Default'
          dependencyAppsJson: ${{ steps.DownloadProjectDependencies.outputs.DownloadedApps }}
          dependencyTestAppsJson: ${{ steps.DownloadProjectDependencies.outputs.DownloadedTestApps }}

      - name: Locate global XLIFF and read config.json
        id: translationInputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gxlf = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter '*.g.xlf' -File)
          if ($gxlf.Count -eq 0) {
            throw "No .g.xlf file found under $env:GITHUB_WORKSPACE"
          }
          if ($gxlf.Count -gt 1) {
            throw "Expected exactly one .g.xlf file, found $($gxlf.Count): $($gxlf.FullName -join ', ')"
          }
          $globalXliffFile = $gxlf[0].FullName
          $translationsFolder = $gxlf[0].DirectoryName

          $configPath = Join-Path $env:GITHUB_WORKSPACE 'config.json'
          if (-not (Test-Path $configPath)) {
            throw "config.json not found at repo root ($configPath)"
          }
          $config = Get-Content -Raw -Path $configPath | ConvertFrom-Json
          $languages = ($config.languages -join ',')
          if (-not $languages) {
            throw "config.json contains no languages"
          }

          Write-Host "Global XLIFF: $globalXliffFile"
          Write-Host "Translations folder: $translationsFolder"
          Write-Host "Target languages: $languages"

          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "globalXliffFile=$globalXliffFile"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "translationsFolder=$translationsFolder"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "languages=$languages"

      - name: Translate
        id: translate
        uses: ./.github/actions/Translate
        with:
          clientId: ${{ secrets.TRADOS_CLIENT_ID }}
          clientSecret: ${{ secrets.TRADOS_CLIENT_SECRET }}
          tenantId: ${{ secrets.TRADOS_TENANT_ID }}
          translationEngineId: ${{ secrets.TRADOS_TRANSLATION_ENGINE_ID }}
          globalXliffFile: ${{ steps.translationInputs.outputs.globalXliffFile }}
          translationsFolder: ${{ steps.translationInputs.outputs.translationsFolder }}
          targetLanguages: ${{ steps.translationInputs.outputs.languages }}
          # TEMPORARY: forced to false for one real-API test run, since the
          # workflow_dispatch button needs this file on the default branch to
          # render its input form. Revert to the conditional right after.
          dryRun: 'false'

      # DIAGNOSE (temporär): Ergebnisdateien zum manuellen Nachsehen, solange
      # der Commit-Schritt noch nicht existiert.
      - name: 'DIAGNOSE: Übersetzte Dateien hochladen'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1
        if: success() || failure()
        with:
          name: 'DIAGNOSE-translated-xlf'
          path: '**/Translations/*.xlf'
          if-no-files-found: ignore
